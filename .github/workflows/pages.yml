# Veröffentlicht die Web-App (Ordner web/) auf GitHub Pages – bei jedem Hochladen auf main.
# Vorher werden Katalog und Offline-Liste aktualisiert und alle Tests ausgeführt.
# Einmalig nötig: im Repository unter Settings › Pages bei „Source“ „GitHub Actions“ wählen.
# Actions sind auf feste Commit-Hashes festgelegt (sicherer als Versionsnamen); die Version steht als Kommentar dahinter.

name: Web-App veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Katalog prüfen
        run: python3 tools/catalog/katalog.py --check

      - name: Web-App bauen (Katalog, Fotos, Offline-Liste)
        run: python3 tools/web/build.py

      - name: Tests
        working-directory: web
        run: node --test tests/*.test.js

      - name: Nur die App-Dateien zusammenstellen
        run: |
          mkdir _site
          cp -R web/index.html web/manifest.webmanifest web/sw.js web/css web/js web/data web/icons web/images _site/

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
